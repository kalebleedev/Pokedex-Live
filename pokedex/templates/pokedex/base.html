{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Pokedex Live{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'pokedex/style.css'%}">
    </head>

    <body>
        <header class="topbar">
            <a class="brand" href="{% url 'home' %}">Pokedex Live</a>
            <nav>
                <a href="{%url 'home' %}">Browse</a>
            </nav>
        </header>

        <main class="container">
            {% block content %}{% endblock %}
        </main>
        {% block scripts %} {% endblock %}
    </body>
</html>
