{% extends "pokedex/base.html" %}

{% block content %}
<h1>Browse Pokemon</h1>
<div class="grid">
    {% for p in pokemon %}
        {% include "pokedex/_card.html" %}
    {% empty %}
        <p>No Pokemon on this page.</p>
    {% endfor %}
</div>

<div class="pager">
    {% if has_previous %}
        <a href="?page={{page:add:'-1'}}">Previous</a>
    {% endif %}

    <span>Page {{page}}</span>
    {% if has_next %}
        <a href="?page={{page:add:'1'}}">Next</a>
    {% endif %}

</div>
{% endblock %}
